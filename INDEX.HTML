<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRM Inteligente → SaleU</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #0a0a0a,
        #111111,
        #1a1a1a
    );

    min-height:100vh;

    padding:30px 15px;

    color:white;
}

.container{

    max-width:720px;

    margin:auto;

    background:#161616;

    border:1px solid #2c2c2c;

    border-radius:28px;

    padding:35px;

    box-shadow:
    0 10px 45px rgba(0,0,0,.45);
}

.header{

    text-align:center;

    margin-bottom:32px;
}

.header h1{

    font-size:32px;

    font-weight:900;

    margin-bottom:10px;

    color:white;
}

.header p{

    color:#a1a1aa;

    font-size:14px;
}

.progress-container{

    width:100%;

    height:10px;

    background:#2a2a2a;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:25px;
}

.progress-bar{

    height:100%;

    width:0%;

    background:
    linear-gradient(
        90deg,
        #991b1b,
        #ef4444
    );

    transition:.3s;
}

.step{

    font-size:13px;

    color:#9ca3af;

    margin-bottom:12px;
}

.question{

    font-size:28px;

    font-weight:800;

    margin-bottom:10px;

    line-height:1.3;
}

.help{

    color:#b3b3b3;

    margin-bottom:28px;

    line-height:1.5;
}

.options{

    display:flex;

    flex-direction:column;

    gap:14px;
}

.option-btn{

    width:100%;

    border:none;

    background:
    linear-gradient(
        90deg,
        #991b1b,
        #dc2626
    );

    color:white;

    padding:18px;

    border-radius:18px;

    cursor:pointer;

    font-size:15px;

    font-weight:700;

    transition:.2s;
}

.option-btn:hover{

    transform:translateY(-2px);

    background:
    linear-gradient(
        90deg,
        #b91c1c,
        #ef4444
    );
}

.option-desc{

    font-size:12px;

    color:#9ca3af;

    margin-top:6px;

    margin-left:5px;
}

.result-box{

    display:none;

    margin-top:30px;

    background:#101010;

    border:1px solid #dc2626;

    border-radius:22px;

    padding:25px;
}

.result-box h3{

    color:#ef4444;

    margin-bottom:18px;

    font-size:22px;
}

.result-grid{

    display:grid;

    grid-template-columns:1fr;

    gap:14px;
}

.result-item{

    background:#1f1f1f;

    border:1px solid #313131;

    padding:15px;

    border-radius:15px;
}

.result-item label{

    display:block;

    margin-bottom:6px;

    font-size:12px;

    color:#9ca3af;
}

.result-item strong{

    font-size:16px;

    color:white;
}

.form-section{

    display:none;

    margin-top:30px;
}

.form-section h2{

    margin-bottom:20px;

    font-size:24px;

    color:white;
}

.input-group{

    margin-bottom:18px;
}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

    color:#d1d5db;
}

.input-group input,
.input-group select,
.input-group textarea{

    width:100%;

    padding:15px;

    border-radius:15px;

    border:1px solid #3a3a3a;

    background:#111111;

    color:white;

    font-size:14px;

    transition:.2s;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{

    outline:none;

    border-color:#dc2626;

    box-shadow:
    0 0 0 3px rgba(220,38,38,.15);
}

.input-group textarea{

    resize:vertical;

    min-height:110px;
}

.submit-btn{

    width:100%;

    border:none;

    background:
    linear-gradient(
        90deg,
        #991b1b,
        #dc2626
    );

    color:white;

    padding:18px;

    border-radius:18px;

    cursor:pointer;

    font-size:16px;

    font-weight:800;

    margin-top:10px;

    transition:.2s;
}

.submit-btn:hover{

    transform:translateY(-2px);
}

.reset-btn{

    width:100%;

    border:none;

    background:#2b2b33;

    color:white;

    padding:16px;

    border-radius:18px;

    cursor:pointer;

    margin-top:15px;

    font-size:14px;

    font-weight:700;
}

.loading{

    display:none;

    margin-top:18px;

    text-align:center;

    color:#ef4444;

    font-weight:700;
}

.success{

    display:none;

    margin-top:20px;

    background:#052e16;

    color:#bbf7d0;

    padding:18px;

    border-radius:14px;

    border:1px solid #166534;
}

.error{

    display:none;

    margin-top:20px;

    background:#450a0a;

    color:#fecaca;

    padding:18px;

    border-radius:14px;

    border:1px solid #b91c1c;
}

@media(max-width:640px){

    .container{

        padding:24px;
    }

    .question{

        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>CRM Inteligente → SaleU</h1>

        <p>
            Clasificación automática profesional de leads
        </p>

    </div>

    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>

    <div class="step" id="stepText"></div>

    <div class="question" id="question"></div>

    <div class="help" id="help"></div>

    <div class="options" id="options"></div>

    <div class="result-box" id="resultBox">

        <h3>Clasificación generada</h3>

        <div class="result-grid">

            <div class="result-item">

                <label>Origen</label>

                <strong id="rOrigen"></strong>

            </div>

            <div class="result-item">

                <label>Campaña</label>

                <strong id="rCampana"></strong>

            </div>

            <div class="result-item">

                <label>Subcampaña</label>

                <strong id="rSubcampana"></strong>

            </div>

        </div>

    </div>

        <div class="form-section" id="formSection">

        <h2>Datos del Cliente</h2>

        <div class="input-group">

            <label>Nombre</label>

            <input
                type="text"
                id="nombre"
                placeholder="Nombre del cliente"
            >

        </div>

        <div class="input-group">

            <label>Apellido Paterno</label>

            <input
                type="text"
                id="apellidoPaterno"
                placeholder="Apellido paterno"
            >

        </div>

        <div class="input-group">

            <label>Apellido Materno</label>

            <input
                type="text"
                id="apellidoMaterno"
                placeholder="Apellido materno"
            >

        </div>

        <div class="input-group">

            <label>Teléfono</label>

            <input
                type="tel"
                id="telefono"
                placeholder="6141234567"
            >

        </div>

        <div class="input-group">

            <label>Correo</label>

            <input
                type="email"
                id="correo"
                placeholder="correo@ejemplo.com"
            >

        </div>

        <div class="input-group">

            <label>Vehículo de interés</label>

            <select id="producto">

                <option value="">
                    Seleccionar vehículo
                </option>

                <option value="MG5 MCE">
                    MG5
                </option>

                <option value="MG GT">
                    MG GT
                </option>

                <option value="MG4">
                    MG4
                </option>

                <option value="ZS">
                    ZS
                </option>

                <option value="HS">
                    HS
                </option>

                <option value="RX8">
                    RX8
                </option>

                <option value="RX9">
                    RX9
                </option>

                <option value="Cyberster">
                    Cyberster
                </option>

                <option value="MGIMLS7">
                    IM LS7
                </option>

                <option value="MG3">
                    MG3
                </option>

            </select>

        </div>

        <div class="input-group">

            <label>Intención de compra</label>

            <select id="intencionCompra">

                <option value="">
                    Seleccionar
                </option>

                <option value="0_3M">
                    0 a 3 meses
                </option>

                <option value="3_6M">
                    3 a 6 meses
                </option>

                <option value="Mthan6M">
                    Más de 6 meses
                </option>

            </select>

        </div>

        <div class="input-group">

            <label>Temperatura del lead</label>

            <select id="temperatura">

                <option value="0">
                    Baja
                </option>

                <option value="1">
                    Media
                </option>

                <option value="2">
                    Alta
                </option>

            </select>

        </div>

        <div class="input-group">

            <label>Comentarios</label>

            <textarea
                id="comentarios"
                placeholder="Información adicional del cliente"
            ></textarea>

        </div>

        <button
            class="submit-btn"
            onclick="enviarLead()"
        >

            Enviar Lead a SaleU

        </button>

        <button
            class="reset-btn"
            onclick="resetFlow()"
        >

            Reiniciar Asistente

        </button>

        <div class="loading" id="loading">

            Enviando lead...

        </div>

        <div class="success" id="successBox"></div>

        <div class="error" id="errorBox"></div>

    </div>

</div>

<script>

const API_URL =
"http://127.0.0.1:8000/crear_lead";

const crmData = {

    origen: "",

    campaña: "",

    subcampaña: ""

};

function updateProgress(step,total){

    const percent =
    (step / total) * 100;

    document
    .getElementById("progressBar")
    .style.width = percent + "%";

    document
    .getElementById("stepText")
    .innerText =
    "Paso " + step + " de " + total;

}

function setQuestion(question,help=""){

    document
    .getElementById("question")
    .innerText = question;

    document
    .getElementById("help")
    .innerText = help;

}

function clearMessages(){

    document
    .getElementById("successBox")
    .style.display = "none";

    document
    .getElementById("errorBox")
    .style.display = "none";

}

function setOptions(options){

    const container =
    document.getElementById("options");

    container.innerHTML = "";

    options.forEach(opt => {

        const wrapper =
        document.createElement("div");

        const button =
        document.createElement("button");

        button.className =
        "option-btn";

        button.innerText =
        opt.text;

        button.onclick =
        opt.action;

        wrapper.appendChild(button);

        if(opt.desc){

            const desc =
            document.createElement("div");

            desc.className =
            "option-desc";

            desc.innerText =
            opt.desc;

            wrapper.appendChild(desc);

        }

        container.appendChild(wrapper);

    });

}

function setResult(
    origen,
    campaña,
    subcampaña
){

    crmData.origen = origen;

    crmData.campaña = campaña;

    crmData.subcampaña = subcampaña;

    document
    .getElementById("rOrigen")
    .innerText = origen;

    document
    .getElementById("rCampana")
    .innerText = campaña;

    document
    .getElementById("rSubcampana")
    .innerText = subcampaña;

    document
    .getElementById("resultBox")
    .style.display = "block";

    document
    .getElementById("formSection")
    .style.display = "block";

    document
    .getElementById("options")
    .innerHTML = "";

    document
    .getElementById("question")
    .innerText =
    "Clasificación completada";

    document
    .getElementById("help")
    .innerText =
    "Ahora captura los datos del cliente";

}

function resetFlow(){

    crmData.origen = "";

    crmData.campaña = "";

    crmData.subcampaña = "";

    document
    .getElementById("resultBox")
    .style.display = "none";

    document
    .getElementById("formSection")
    .style.display = "none";

    document
    .getElementById("nombre")
    .value = "";

    document
    .getElementById("apellidoPaterno")
    .value = "";

    document
    .getElementById("apellidoMaterno")
    .value = "";

    document
    .getElementById("telefono")
    .value = "";

    document
    .getElementById("correo")
    .value = "";

    document
    .getElementById("producto")
    .value = "";

    document
    .getElementById("comentarios")
    .value = "";

    clearMessages();

    start();

}

function start(){

    updateProgress(1,3);

    setQuestion(
        "Vamos a registrar un cliente",
        "Responde unas preguntas y el sistema clasificará automáticamente el lead"
    );

    setOptions([

        {
            text:"Comenzar",
            desc:"Iniciar asistente",
            action:paso1
        }

    ]);

}

function paso1(){

    updateProgress(1,3);

    setQuestion(
        "¿Este cliente ya existía?",
        "Selecciona la opción correcta"
    );

    setOptions([

        {
            text:"Sí",
            desc:"Cliente ya registrado",

            action:() => {

                updateProgress(2,3);

                setQuestion(
                    "¿Regresó sin cita?",
                    "Si volvió sin avisar es BE BACK"
                );

                setOptions([

                    {
                        text:"Sí",
                        desc:"Cliente BE BACK",

                        action:() => {

                            setResult(
                                "BE BACK",
                                "BE BACK",
                                "BE BACK"
                            );

                        }
                    },

                    {
                        text:"No",
                        desc:"Ya estaba en seguimiento",

                        action:() => {

                            document
                            .getElementById("options")
                            .innerHTML = "";

                            document
                            .getElementById("question")
                            .innerText =
                            "No registrar nuevo lead";

                            document
                            .getElementById("help")
                            .innerText =
                            "El cliente ya existe en seguimiento";

                        }
                    }

                ]);

            }
        },

        {
            text:"No",
            desc:"Cliente nuevo",
            action:paso2
        }

    ]);

}

function paso2(){

    updateProgress(2,3);

    setQuestion(
        "¿Cómo llegó este cliente?",
        "Selecciona el origen"
    );

    setOptions([

        {
            text:"Publicidad",
            desc:"Meta Ads o redes sociales",
            action:pasoDigital
        },

        {
            text:"Prospección",
            desc:"Búsqueda fuera de agencia",
            action:pasoProspeccion
        },

        {
            text:"Piso",
            desc:"Llegó directamente a la agencia",

            action:() => {

                setResult(
                    "PISO",
                    "PISO",
                    "PISO"
                );

            }
        },

        {
            text:"Cartera",
            desc:"Cliente ya conocido",

            action:() => {

                setResult(
                    "CARTERA",
                    "CARTERA",
                    "CARTERA"
                );

            }
        },

        {
            text:"Referido",
            desc:"Cliente recomendado",

            action:() => {

                setResult(
                    "REFERIDO",
                    "REFERIDO",
                    "REFERIDO"
                );

            }
        },

        {
            text:"Carril de servicio",
            desc:"Cliente proveniente de servicio",

            action:() => {

                setResult(
                    "CARRIL SERVICIO",
                    "CARRIL SERVICIO",
                    "CARRIL SERVICIO"
                );

            }
        }

    ]);

}

function pasoDigital(){

    updateProgress(3,3);

    setQuestion(
        "¿Dónde vio el anuncio?",
        "Selecciona el origen digital"
    );

    setOptions([

        {
            text:"Publicidad Marca",
            desc:"Publicidad oficial",

            action:() => {

                setResult(
                    "MARCA",
                    "MARCA",
                    "META"
                );

            }
        },

        {
            text:"Publicidad Agencia",
            desc:"Campañas de agencia",

            action:() => {

                const campaña =
                prompt(
                    "Nombre de la campaña"
                );

                setResult(
                    "META",
                    "META ADS",
                    campaña || "LEADS"
                );

            }
        },

        {
            text:"Fan Page",
            desc:"Fan page del asesor",

            action:() => {

                const fanpage =
                prompt(
                    "Nombre de la Fan Page"
                );

                setResult(
                    "FAN PAGE",
                    "FAN PAGE",
                    fanpage || "FAN PAGE"
                );

            }
        }

    ]);

}

function pasoProspeccion(){

    updateProgress(3,3);

    setQuestion(
        "¿Dónde se prospectó?",
        "Selecciona el lugar"
    );

    setOptions([

        {
            text:"Calle",
            desc:"Prospección rápida",

            action:() => {

                setResult(
                    "CALLE",
                    "CALLE",
                    "CALLE"
                );

            }
        },

        {
            text:"Evento",
            desc:"Stand o feria",

            action:() => {

                const evento =
                prompt(
                    "Nombre del evento"
                );

                setResult(
                    "EVENTO",
                    "EVENTO",
                    evento || "EVENTO"
                );

            }
        },

        {
            text:"Fashion Mall",
            desc:"Prospección en Fashion Mall",

            action:() => {

                setResult(
                    "PLAZAS",
                    "PLAZAS",
                    "FASHION MALL"
                );

            }
        },

        {
            text:"Sendero",
            desc:"Prospección en Plaza Sendero",

            action:() => {

                setResult(
                    "PLAZAS",
                    "PLAZAS",
                    "SENDERO"
                );

            }
        }

    ]);

}

async function enviarLead(){

    clearMessages();

    const payload = {

        nombre:
        document.getElementById("nombre").value,

        apellidoPaterno:
        document.getElementById("apellidoPaterno").value,

        apellidoMaterno:
        document.getElementById("apellidoMaterno").value,

        telefono:
        document.getElementById("telefono").value,

        correo:
        document.getElementById("correo").value,

        producto:
        document.getElementById("producto").value,

        comentarios:
        document.getElementById("comentarios").value,

        origen:
        crmData.origen,

        campaña:
        crmData.campaña,

        subcampaña:
        crmData.subcampaña,

        intencionCompra:
        document.getElementById("intencionCompra").value,

        temperatura:
        document.getElementById("temperatura").value

    };

    console.log(
        "Payload enviado:",
        payload
    );

    document
    .getElementById("loading")
    .style.display = "block";

    try{

        const response =
        await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:
            JSON.stringify(payload)

        });

        const data =
        await response.json();

        document
        .getElementById("loading")
        .style.display = "none";

        if(data.success === 1){

            document
            .getElementById("successBox")
            .style.display = "block";

            document
            .getElementById("successBox")
            .innerHTML =
            "<strong>Lead enviado correctamente a SaleU</strong>";

        }else{

            document
            .getElementById("errorBox")
            .style.display = "block";

            document
            .getElementById("errorBox")
            .innerHTML =
            "<strong>Error:</strong> " +
            (
                data.message ||
                "No se pudo enviar"
            );

        }

    }catch(error){

        document
        .getElementById("loading")
        .style.display = "none";

        document
        .getElementById("errorBox")
        .style.display = "block";

        document
        .getElementById("errorBox")
        .innerHTML =
        "<strong>Error de conexión:</strong> " +
        error.message;

        console.error(error);

    }

}

start();

</script>

<button
    class="reset-btn"
    onclick="resetFlow()"
    style="margin-top:25px;"
>
    Reiniciar Asistente
</button>

</body>

</html>
